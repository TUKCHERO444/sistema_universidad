{% extends 'base.html' %}

{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Perfil Institucional</h1>
    <p class="page-subtitle">Información de cuenta y credenciales de acceso al sistema.</p>
  </div>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="form-panel">
      <div class="form-group-title">Datos del Usuario</div>
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" value="{{ usuario.username }}" readonly disabled>
      </div>
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label">Nombres</label>
          <input type="text" class="form-control" value="{{ usuario.first_name }}" readonly disabled>
        </div>
        <div class="col-6">
          <label class="form-label">Apellidos</label>
          <input type="text" class="form-control" value="{{ usuario.last_name }}" readonly disabled>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Correo Institucional</label>
        <input type="email" class="form-control" value="{{ usuario.email }}" readonly disabled>
      </div>
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label">DNI</label>
          <input type="text" class="form-control font-monospace" value="{{ usuario.dni|default:'No registrado' }}" readonly disabled>
        </div>
        <div class="col-6">
          <label class="form-label">Rol en el Sistema</label>
          <input type="text" class="form-control" value="{{ usuario.get_rol_display }}" readonly disabled>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
