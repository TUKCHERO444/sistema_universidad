{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ titulo }}</h1>
  </div>
  <a href="{% url 'academico:plan_estudio_list' %}" class="btn btn-secondary">← Volver</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="col-md-6">
        <label class="form-label">Carrera</label>
        {{ form.carrera }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Código del Plan</label>
        {{ form.codigo }}
      </div>
      <div class="col-md-12">
        <label class="form-label">Nombre del Plan</label>
        {{ form.nombre }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Año de Inicio</label>
        {{ form.year_inicio }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Total de Créditos</label>
        {{ form.total_creditos }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Estado</label>
        {{ form.estado }}
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'academico:plan_estudio_list' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
