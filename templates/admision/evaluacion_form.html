{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ titulo }}</h1>
  </div>
  <a href="{% url 'admision:evaluacion_list' %}" class="btn btn-secondary">← Volver</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="col-md-6">
        <label class="form-label">Postulación</label>
        {{ form.postulacion }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Nombre de la Evaluación</label>
        {{ form.nombre }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Fecha de Evaluación</label>
        {{ form.fecha }}
      </div>
      <div class="col-md-3">
        <label class="form-label">Puntaje Obtenido</label>
        {{ form.puntaje }}
      </div>
      <div class="col-md-3">
        <label class="form-label">Puntaje Máximo</label>
        {{ form.puntaje_maximo }}
      </div>
      <div class="col-12">
        <label class="form-label">Observación</label>
        {{ form.observacion }}
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'admision:evaluacion_list' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
