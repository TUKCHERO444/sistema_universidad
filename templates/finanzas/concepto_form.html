{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ titulo }}</h1>
  </div>
  <a href="{% url 'finanzas:concepto_list' %}" class="btn btn-secondary">← Volver</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="col-md-6">
        <label class="form-label">Código</label>
        {{ form.codigo }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        {{ form.nombre }}
      </div>
      <div class="col-12">
        <label class="form-label">Descripción</label>
        {{ form.descripcion }}
      </div>
      <div class="col-12">
        <div class="form-check">
          {{ form.estado }}
          <label class="form-check-label">Activo</label>
        </div>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'finanzas:concepto_list' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
