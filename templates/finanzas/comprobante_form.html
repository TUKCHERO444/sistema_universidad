{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ titulo }}</h1>
  </div>
  <a href="{% url 'finanzas:comprobante_list' %}" class="btn btn-secondary">← Volver</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="col-md-6">
        <label class="form-label">Pago</label>
        {{ form.pago }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Tipo de Comprobante</label>
        {{ form.tipo }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Serie</label>
        {{ form.serie }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Número</label>
        {{ form.numero }}
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'finanzas:comprobante_list' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
