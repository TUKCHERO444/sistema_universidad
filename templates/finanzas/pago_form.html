{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ titulo }}</h1>
  </div>
  <a href="{% url 'finanzas:pago_list' %}" class="btn btn-secondary">← Volver</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="col-md-6">
        <label class="form-label">Cuenta por Cobrar</label>
        {{ form.cuenta }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Monto</label>
        {{ form.monto }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Método de Pago</label>
        {{ form.metodo }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Número de Operación</label>
        {{ form.numero_operacion }}
      </div>
      <div class="col-md-6">
        <label class="form-label">Estado</label>
        {{ form.estado }}
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'finanzas:pago_list' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
